services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: Newtech135

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d school_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: web-content-management-api
    build: .
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8090:8090"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/school_db
      SPRING_DATASOURCE_USERNAME: postgres_user
      SPRING_DATASOURCE_PASSWORD: Newtech135

    volumes:
      - /opt/projects/teach/upload/images:/opt/projects/teach/upload/images

volumes:
  postgres_data: